---
layout: default
---

{% if page.title or page.excerpt %}
  <header class="page__header">
    {% if page.title %}
      <h1 class="page__title">{{ page.title }}</h1>
    {% endif %}
    {% if page.excerpt %}
      <p class="page__lead">{{ page.excerpt }}</p>
    {% endif %}
  </header>
{% endif %}

{{ content }}
