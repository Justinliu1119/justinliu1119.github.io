<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6f0f7"/><stop offset="1" stop-color="#bcd3e6"/>
    </linearGradient>
    <linearGradient id="auvbody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6c15a"/><stop offset="1" stop-color="#e09a24"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#2f5d8a"/>
    </marker>
  </defs>
  <rect width="800" height="500" fill="#ffffff"/>
  <!-- sky band + water -->
  <path d="M0 118 C 100 104, 200 132, 300 118 S 500 104, 600 118 S 760 130, 800 118 L800 500 L0 500 Z" fill="url(#water)"/>
  <path d="M0 118 C 100 104, 200 132, 300 118 S 500 104, 600 118 S 760 130, 800 118" fill="none" stroke="#3d6e96" stroke-width="4"/>
  <!-- seabed -->
  <path d="M0 462 C 140 448, 260 472, 400 460 S 660 446, 800 458 L800 500 L0 500 Z" fill="#d8ccb8"/>
  <path d="M0 462 C 140 448, 260 472, 400 460 S 660 446, 800 458" fill="none" stroke="#a8977a" stroke-width="2"/>

  <!-- signal paths: AUV at (360,300) -->
  <g stroke="#2f5d8a" stroke-width="3.6" stroke-dasharray="10 8" fill="none" marker-end="url(#arr)">
    <line x1="350" y1="288" x2="122" y2="128"/>
    <line x1="358" y1="284" x2="298" y2="128"/>
    <line x1="372" y1="284" x2="492" y2="126"/>
    <line x1="382" y1="290" x2="676" y2="128"/>
    <line x1="384" y1="314" x2="626" y2="432"/>
  </g>
  <!-- range labels -->
  <g font-size="34" font-style="italic" fill="#2f5d8a" font-family="Palatino, 'Palatino Linotype', Georgia, serif">
    <text x="196" y="214">r<tspan font-size="22" dy="8">0</tspan></text>
    <text x="282" y="218">d<tspan font-size="22" dy="8">1</tspan></text>
    <text x="446" y="212">d<tspan font-size="22" dy="8">2</tspan></text>
    <text x="560" y="206">d<tspan font-size="22" dy="8">3</tspan></text>
    <text x="508" y="418">d<tspan font-size="22" dy="8">4</tspan></text>
  </g>

  <!-- emission rings -->
  <g fill="none" stroke="#e09a24" stroke-width="2">
    <circle cx="362" cy="300" r="52" opacity="0.55"/>
    <circle cx="362" cy="300" r="76" opacity="0.28"/>
  </g>

  <!-- AUV -->
  <g transform="translate(362 300) scale(1.15)">
    <path d="M-62 0 C -62 -17, -40 -21, 0 -21 L 40 -21 C 60 -21, 68 -10, 68 0 C 68 10, 60 21, 40 21 L 0 21 C -40 21, -62 17, -62 0 Z" fill="url(#auvbody)" stroke="#9c6a12" stroke-width="2"/>
    <path d="M-62 0 L -80 -16 L -80 16 Z" fill="#c9881c" stroke="#9c6a12" stroke-width="2" stroke-linejoin="round"/>
    <rect x="-8" y="-33" width="22" height="13" rx="4" fill="#e09a24" stroke="#9c6a12" stroke-width="2"/>
    <circle cx="48" cy="0" r="6" fill="#2a2622" opacity="0.75"/>
  </g>
  <text x="362" y="372" font-size="32" font-weight="700" fill="#2a2622" text-anchor="middle">AUV</text>

  <!-- surface buoys -->
  <g font-size="38" font-weight="700" fill="#2a2622" text-anchor="middle">
    <g transform="translate(118 112) scale(1.35)"><path d="M-18 6 L18 6 L12 20 L-12 20 Z" fill="#c0392b"/><rect x="-3" y="-30" width="6" height="36" fill="#7a2418"/><circle cy="-32" r="6" fill="#c0392b"/></g>
    <text x="118" y="48">s<tspan font-size="25" dy="9">0</tspan></text>
    <g transform="translate(298 116) scale(1.35)"><path d="M-18 6 L18 6 L12 20 L-12 20 Z" fill="#c0392b"/><rect x="-3" y="-30" width="6" height="36" fill="#7a2418"/><circle cy="-32" r="6" fill="#c0392b"/></g>
    <text x="298" y="52">s<tspan font-size="25" dy="9">1</tspan></text>
    <g transform="translate(494 114) scale(1.35)"><path d="M-18 6 L18 6 L12 20 L-12 20 Z" fill="#c0392b"/><rect x="-3" y="-30" width="6" height="36" fill="#7a2418"/><circle cy="-32" r="6" fill="#c0392b"/></g>
    <text x="494" y="50">s<tspan font-size="25" dy="9">2</tspan></text>
    <g transform="translate(680 116) scale(1.35)"><path d="M-18 6 L18 6 L12 20 L-12 20 Z" fill="#c0392b"/><rect x="-3" y="-30" width="6" height="36" fill="#7a2418"/><circle cy="-32" r="6" fill="#c0392b"/></g>
    <text x="680" y="52">s<tspan font-size="25" dy="9">3</tspan></text>
    <!-- seabed receiver -->
    <g transform="translate(640 446) scale(1.35)"><path d="M-22 10 L22 10 L16 -4 L-16 -4 Z" fill="#c0392b"/><rect x="-3" y="-22" width="6" height="18" fill="#7a2418"/><circle cy="-24" r="6" fill="#c0392b"/></g>
    <text x="712" y="444">s<tspan font-size="25" dy="9">4</tspan></text>
  </g>
</svg>
