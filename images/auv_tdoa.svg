<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6f0f7"/><stop offset="1" stop-color="#bcd3e6"/>
    </linearGradient>
    <linearGradient id="auvbody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6c15a"/><stop offset="1" stop-color="#e09a24"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#2f5d8a"/>
    </marker>
  </defs>
  <rect width="800" height="500" fill="#ffffff"/>
  <!-- sky band + water -->
  <path d="M0 118 C 100 104, 200 132, 300 118 S 500 104, 600 118 S 760 130, 800 118 L800 500 L0 500 Z" fill="url(#water)"/>
  <path d="M0 118 C 100 104, 200 132, 300 118 S 500 104, 600 118 S 760 130, 800 118" fill="none" stroke="#3d6e96" stroke-width="3"/>
  <!-- seabed -->
  <path d="M0 462 C 140 448, 260 472, 400 460 S 660 446, 800 458 L800 500 L0 500 Z" fill="#d8ccb8"/>
  <path d="M0 462 C 140 448, 260 472, 400 460 S 660 446, 800 458" fill="none" stroke="#a8977a" stroke-width="2"/>

  <!-- signal paths: AUV at (360,300) -->
  <g stroke="#2f5d8a" stroke-width="2.4" stroke-dasharray="7 6" fill="none" marker-end="url(#arr)">
    <line x1="350" y1="288" x2="122" y2="128"/>
    <line x1="358" y1="284" x2="298" y2="128"/>
    <line x1="372" y1="284" x2="492" y2="126"/>
    <line x1="382" y1="290" x2="676" y2="128"/>
    <line x1="384" y1="314" x2="626" y2="432"/>
  </g>
  <!-- range labels -->
  <g font-size="21" font-style="italic" fill="#2f5d8a" font-family="Palatino, 'Palatino Linotype', Georgia, serif">
    <text x="214" y="196">r<tspan font-size="14" dy="5">0</tspan></text>
    <text x="300" y="200">d<tspan font-size="14" dy="5">1</tspan></text>
    <text x="444" y="196">d<tspan font-size="14" dy="5">2</tspan></text>
    <text x="548" y="196">d<tspan font-size="14" dy="5">3</tspan></text>
    <text x="508" y="402">d<tspan font-size="14" dy="5">4</tspan></text>
  </g>

  <!-- emission rings -->
  <g fill="none" stroke="#e09a24" stroke-width="2">
    <circle cx="362" cy="300" r="52" opacity="0.55"/>
    <circle cx="362" cy="300" r="76" opacity="0.28"/>
  </g>

  <!-- AUV -->
  <g transform="translate(362 300)">
    <path d="M-62 0 C -62 -17, -40 -21, 0 -21 L 40 -21 C 60 -21, 68 -10, 68 0 C 68 10, 60 21, 40 21 L 0 21 C -40 21, -62 17, -62 0 Z" fill="url(#auvbody)" stroke="#9c6a12" stroke-width="2"/>
    <path d="M-62 0 L -80 -16 L -80 16 Z" fill="#c9881c" stroke="#9c6a12" stroke-width="2" stroke-linejoin="round"/>
    <rect x="-8" y="-33" width="22" height="13" rx="4" fill="#e09a24" stroke="#9c6a12" stroke-width="2"/>
    <circle cx="48" cy="0" r="6" fill="#2a2622" opacity="0.75"/>
  </g>
  <text x="362" y="358" font-size="22" font-weight="700" fill="#2a2622" text-anchor="middle">AUV</text>

  <!-- surface buoys -->
  <g font-size="24" font-weight="700" fill="#2a2622" text-anchor="middle">
    <g transform="translate(118 112)"><path d="M-18 6 L18 6 L12 20 L-12 20 Z" fill="#c0392b"/><rect x="-3" y="-30" width="6" height="36" fill="#7a2418"/><circle cy="-32" r="6" fill="#c0392b"/></g>
    <text x="118" y="62">s<tspan font-size="16" dy="6">0</tspan></text>
    <g transform="translate(298 116)"><path d="M-18 6 L18 6 L12 20 L-12 20 Z" fill="#c0392b"/><rect x="-3" y="-30" width="6" height="36" fill="#7a2418"/><circle cy="-32" r="6" fill="#c0392b"/></g>
    <text x="298" y="66">s<tspan font-size="16" dy="6">1</tspan></text>
    <g transform="translate(494 114)"><path d="M-18 6 L18 6 L12 20 L-12 20 Z" fill="#c0392b"/><rect x="-3" y="-30" width="6" height="36" fill="#7a2418"/><circle cy="-32" r="6" fill="#c0392b"/></g>
    <text x="494" y="64">s<tspan font-size="16" dy="6">2</tspan></text>
    <g transform="translate(680 116)"><path d="M-18 6 L18 6 L12 20 L-12 20 Z" fill="#c0392b"/><rect x="-3" y="-30" width="6" height="36" fill="#7a2418"/><circle cy="-32" r="6" fill="#c0392b"/></g>
    <text x="680" y="66">s<tspan font-size="16" dy="6">3</tspan></text>
    <!-- seabed receiver -->
    <g transform="translate(640 446)"><path d="M-22 10 L22 10 L16 -4 L-16 -4 Z" fill="#c0392b"/><rect x="-3" y="-22" width="6" height="18" fill="#7a2418"/><circle cy="-24" r="6" fill="#c0392b"/></g>
    <text x="690" y="440">s<tspan font-size="16" dy="6">4</tspan></text>
  </g>

  <!-- legend -->
  <g transform="translate(24 392)">
    <rect width="232" height="62" rx="8" fill="#ffffff" fill-opacity="0.85" stroke="#c9d6e3"/>
    <text x="14" y="26" font-size="17" fill="#2a2622" font-family="Palatino, 'Palatino Linotype', Georgia, serif"><tspan font-style="italic">c</tspan> Δ<tspan font-style="italic">t</tspan><tspan font-size="12" dy="4" font-style="italic">i</tspan><tspan dy="-4"> = </tspan><tspan font-style="italic">d</tspan><tspan font-size="12" dy="4" font-style="italic">i</tspan><tspan dy="-4"> − </tspan><tspan font-style="italic">r</tspan><tspan font-size="12" dy="4">0</tspan></text>
    <text x="14" y="50" font-size="14" fill="#5a6673">TDOA vs. reference s₀</text>
  </g>
</svg>
